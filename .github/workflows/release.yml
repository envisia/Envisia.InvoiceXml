# Publishes Envisia.InvoiceXml, Envisia.InvoiceXml.Validation, Envisia.InvoiceXml.Validation.Abstractions and
# Envisia.InvoiceXml.Validation.GraalVM to nuget.org when a version tag (v1.2.3, v1.2.3-preview.1, ...) is pushed.
# The GraalVM package is built by graalvm.yml (native library per platform).
#
# Uses nuget.org Trusted Publishing (no long-lived API key):
#   1. On nuget.org open "Trusted Publishing" and add a policy for this repository
#      with workflow file "release.yml".
#   2. Add a repository secret NUGET_USER containing the nuget.org profile name
#      (not the e-mail address) of the account that owns the package.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # nuget.org trusted publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  graalvm:
    uses: ./.github/workflows/graalvm.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: graalvm
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Determine version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: dotnet build Envisia.InvoiceXml.sln --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test Envisia.InvoiceXml.sln --configuration Release --no-build

    - name: Pack
      run: dotnet pack Envisia.InvoiceXml.sln --configuration Release --no-build --output artifacts -p:Version=${{ steps.version.outputs.version }}

    - name: Download the GraalVM package
      uses: actions/download-artifact@v4
      with:
        name: graalvm-package
        path: artifacts

    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to nuget.org
      run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=""
        if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then prerelease="--prerelease"; fi
        gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
